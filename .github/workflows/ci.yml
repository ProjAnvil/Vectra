# This workflow activates only once the branch is pushed to GitHub.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: vet root module
        run: go vet ./...
      - name: test root module
        run: go test ./...
      - name: vet server module
        run: cd server && go vet ./...
      - name: test server module
        run: cd server && go test ./...
      - name: vet mcp module
        run: cd mcp && go vet ./...
      - name: test mcp module
        run: cd mcp && go test ./...
      - name: race root module
        # Same shape the README prescribes: -count=1 disables test caching
        # and the explicit timeout clears the 600s default that the slow
        # internal/vector package would trip spuriously.
        run: go test -race ./... -count=1 -timeout 40m
      - name: cypher alloc gate
        run: go test -run 'TestCypher.*Allocs' -count=1 .

  sdk-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: python sdk tests
        # The harness builds the vectra-server binary itself (VECTRA_SDK_TEST_BIN overrides).
        run: cd sdk/python && python3 -m unittest discover -s tests -v

  sdk-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ts sdk tests
        # No lockfile in sdk/ts: npm install, never npm ci.
        run: cd sdk/ts && npm install && npm test

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build vectra-server
        run: cd server && go build -o ../bin/vectra-server ./cmd/vectra-server
      - name: pick a free port
        run: |
          echo "PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("",0)); print(s.getsockname()[1]); s.close()')" >> "$GITHUB_ENV"
          echo "RAFT_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("",0)); print(s.getsockname()[1]); s.close()')" >> "$GITHUB_ENV"
      - name: boot vectra-server
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          ./bin/vectra-server -id n1 -data "$RUNNER_TEMP/data" \
            -http 127.0.0.1:"$PORT" -raft 127.0.0.1:"$RAFT_PORT" \
            > "$RUNNER_TEMP/vectra-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vectra-server.pid"
          # Readiness for a single-node bootstrap: the HTTP listener answers
          # 503 "starting" on /v1/health until the first write triggers the
          # first raft publish, and writes fail with NOT_LEADER until this
          # node has won its election — so wait for the listener, then for
          # the "entering leader state" raft log line.
          code=000
          for _ in $(seq 1 100); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/v1/health" || true)
            [ "$code" != "000" ] && break
            sleep 0.1
          done
          [ "$code" != "000" ] || { echo "vectra-server did not come up"; cat "$RUNNER_TEMP/vectra-server.log"; exit 1; }
          for _ in $(seq 1 100); do
            grep -q "entering leader state" "$RUNNER_TEMP/vectra-server.log" && break
            sleep 0.1
          done
          grep -q "entering leader state" "$RUNNER_TEMP/vectra-server.log" || { echo "vectra-server did not elect a leader"; cat "$RUNNER_TEMP/vectra-server.log"; exit 1; }
      - name: go embedded example
        run: go run ./examples/go-embedded
      - name: python example
        run: cd examples/python && PYTHONPATH=../../sdk/python/src VECTRA_URL=http://127.0.0.1:$PORT python3 main.py
      - name: typescript example
        run: |
          (cd sdk/ts && npm install && npm run build)
          (cd examples/typescript && npm install && VECTRA_URL=http://127.0.0.1:$PORT node main.mjs)
      - name: stop vectra-server
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/vectra-server.pid")" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/data"
