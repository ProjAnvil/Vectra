[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectra-graph"
version = "0.1.0"
description = "Python SDK for the Vectra REST graph API — standard library only, zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ProjAnvil" }]
# Deliberately empty: the SDK is stdlib-only by contract.
dependencies = []

[project.urls]
Homepage = "https://github.com/projanvil/Vectra"

[tool.setuptools.packages.find]
where = ["src"]
